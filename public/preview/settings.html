<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings — ReportEase (Preview)</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .settings-container { max-width: 760px; margin: 0 auto; padding: var(--space-2) 0; }
        .settings-content { background-color: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-6) var(--space-4); box-shadow: var(--shadow-sm); }
        @media (min-width: 640px) { .settings-content { padding: var(--space-8); } }
        .settings-title { text-align: center; font-size: var(--text-2xl); font-weight: 800; color: var(--color-text-primary); margin: 0 0 var(--space-2) 0; }
        .settings-subtitle { text-align: center; color: var(--color-text-muted); font-size: var(--text-sm); margin: 0 0 var(--space-6) 0; }
        .profile-image-container { display: flex; justify-content: center; margin-bottom: var(--space-6); }
        .profile-image { width: 112px; height: 112px; border-radius: var(--radius-full); background: var(--color-bg-muted); border: 3px solid var(--color-brand-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-image img { width: 100%; height: 100%; object-fit: cover; }
        .form-row { display: grid; grid-template-columns: 1fr; gap: 0; }
        @media (min-width: 640px) { .form-row { grid-template-columns: 1fr 1fr; gap: var(--space-4); } }
        .form-group { margin-bottom: var(--space-5); }
        .form-label { display: block; font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2); font-weight: 600; }
        .form-input { width: 100%; min-height: var(--touch-target-min); padding: 0.75rem 1rem; border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); font-size: 1rem; background: var(--color-bg-surface); color: var(--color-text-primary); }
        .form-input:focus { outline: none; border-color: var(--color-brand-primary); box-shadow: var(--focus-ring); }
        .readonly-field { background: var(--color-bg-muted) !important; color: var(--color-text-muted); border-color: var(--color-border); cursor: not-allowed; }
        .readonly-label { color: var(--color-text-muted); }
        .save-btn { width: 100%; background-color: var(--color-brand-primary); color: var(--color-text-on-brand); border: 2px solid var(--color-brand-primary); padding: 0.875rem 2rem; border-radius: var(--radius-md); font-size: var(--text-base); font-weight: 700; cursor: pointer; margin-top: var(--space-2); }
        .save-btn:hover { background-color: var(--color-brand-primary-hover); border-color: var(--color-brand-primary-hover); }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="app-container">
        <header class="app-header" role="banner">
            <div class="header-left">
                <button type="button" class="mobile-nav-toggle" aria-expanded="false" aria-controls="dashboard-sidebar" aria-label="Toggle navigation menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg><span class="mobile-nav-label">Menu</span></button>
                <a href="dashboard.html" class="logo" aria-label="ReportEase Home"><img src="../images/RE_White.png" alt="ReportEase Logo" width="140" height="40"></a>
            </div>
            <nav class="navigation" aria-label="User account navigation">
                <a href="settings.html" class="nav-link profile-trigger"><img src="../images/user.png" alt="" class="header-avatar" width="32" height="32" aria-hidden="true"><span class="header-user-name">Samanalee</span></a>
                <form class="logout-form"><button type="button" class="nav-link logout-button"><span>Logout</span></button></form>
            </nav>
        </header>
        <div class="dashboard-container">
            <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
            <aside id="dashboard-sidebar" class="sidebar" aria-label="Main menu">
                <nav aria-label="Workspace navigation">
                    <ul class="sidebar-nav-list">
                        <li><a href="dashboard.html" class="nav-link"><img src="../images/home.png" alt="" class="nav-icon" width="20" height="20" aria-hidden="true"><span class="nav-text">Dashboard</span></a></li>
                        <li><a href="create.html" class="nav-link"><svg class="nav-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg><span class="nav-text">Report Issue</span></a></li>
                        <li><a href="issues.html" class="nav-link"><svg class="nav-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg><span class="nav-text">Reported Issues</span></a></li>
                        <li class="active"><a href="settings.html" class="nav-link" aria-current="page"><img src="../images/settings.png" alt="" class="nav-icon" width="20" height="20" aria-hidden="true"><span class="nav-text">Settings</span></a></li>
                    </ul>
                </nav>
            </aside>
            <main id="main-content" class="main-content" tabindex="-1">
                <div class="settings-container">
                    <div class="settings-content">
                        <h1 class="settings-title">Edit <span class="brand-accent">Profile</span></h1>
                        <p class="settings-subtitle">Update your contact details below. University ID and assigned role are managed by administration.</p>
                        <div class="profile-image-container"><div class="profile-image"><img src="../images/user.png" alt="Profile avatar" width="112" height="112"></div></div>
                        <form method="POST" action="#">
                            <div class="form-row">
                                <div class="form-group"><label for="first_name" class="form-label">First Name <span class="required-indicator" aria-hidden="true">*</span></label><input id="first_name" type="text" class="form-input" value="Samanalee"></div>
                                <div class="form-group"><label for="last_name" class="form-label">Last Name <span class="required-indicator" aria-hidden="true">*</span></label><input id="last_name" type="text" class="form-input" value="Fernando"></div>
                            </div>
                            <div class="form-group"><label for="phone_number" class="form-label">Phone Number <span class="required-indicator" aria-hidden="true">*</span></label><input id="phone_number" type="tel" class="form-input" value="0771234567"></div>
                            <div class="form-group"><label for="email" class="form-label">Email Address <span class="required-indicator" aria-hidden="true">*</span></label><input id="email" type="email" class="form-input" value="samanalee@std.appsc.sab.ac.lk"></div>
                            <div class="form-group"><label class="form-label readonly-label">Registration / Staff Number (Read-only)</label><input type="text" class="form-input readonly-field" value="21CIS004" disabled></div>
                            <div class="form-group"><label class="form-label readonly-label">Assigned University Role (Read-only)</label><input type="text" class="form-input readonly-field" value="Student" disabled></div>
                            <button type="button" class="save-btn">SAVE CHANGES</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <footer class="app-footer" role="contentinfo"><p>&copy; 2026 ReportEase &mdash; Faculty of Computing, Sabaragamuwa University of Sri Lanka.</p></footer>
    </div>
    <script src="../js/app-ui.js" defer></script>
</body>
</html>
